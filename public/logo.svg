<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded elegant background -->
  <rect width="100" height="100" rx="24" fill="#0E1015" stroke="#C8FF00" stroke-opacity="0.2" stroke-width="2" />
  
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8FF00" />
      <stop offset="100%" stop-color="#8BE000" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern minimalist geometric interlocking chart representing high growth -->
  <g transform="translate(14, 14)">
    <!-- Base grid element representing data architecture -->
    <path d="M 5 60 L 67 60" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
    
    <!-- Growth bar 1 (ClickHouse Data Processing) -->
    <rect x="15" y="38" width="10" height="22" rx="3" fill="#374151" />
    
    <!-- Growth bar 2 (AI Intelligence Layer) -->
    <rect x="31" y="22" width="10" height="38" rx="3" fill="#4B5563" />
    
    <!-- Growth bar 3 (Predictive Analytics - Highlighted in Neon Lime) -->
    <rect x="47" y="6" width="10" height="54" rx="3" fill="url(#neonGradient)" />
    
    <!-- Elegant upward vector graph line interlocking the bars -->
    <path d="M 8 48 L 24 32 L 40 18 L 56 4" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Predictive indicator dot -->
    <circle cx="56" cy="4" r="5" fill="#C8FF00" filter="url(#glowEffect)" />
  </g>
</svg>
